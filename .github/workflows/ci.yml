name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The workflow only needs permission to download the repository contents.
permissions:
  contents: read

# When a branch receives another commit, stop its obsolete in-progress run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run test suite
        run: python -m pytest --verbose

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image
        run: docker build --tag url-shortener:ci .

      - name: Start container
        run: >-
          docker run --detach
          --name url-shortener-ci
          --publish 8000:8000
          url-shortener:ci

      - name: Verify health endpoint
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs url-shortener-ci
          exit 1

      # "always" guarantees cleanup even when the health check fails.
      - name: Stop container
        if: always()
        run: docker rm --force url-shortener-ci
